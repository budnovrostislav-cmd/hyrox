<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX">
<meta name="theme-color" content="#0A0C0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Трекер HYROX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0C0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: тёмное приложение под одну руку. Четыре раздела внизу: Сегодня, План, Питание, Прогресс.
   Главный экран отвечает на один вопрос — что делать сегодня. Цвета: тренировка — оранжево-красный,
   бег — голубой, питание — янтарный, восстановление и план — зелёный. */
:root{
  color-scheme:dark;
  --bg:#0A0C0F;
  --surface:#13171C;
  --raised:#1B2128;
  --line:#262D36;
  --ink:#ECEFF3;
  --muted:#8B96A3;
  --train:#FF5A36;
  --run:#29C3FF;
  --food:#FFB21E;
  --rec:#3BDB8E;
  --danger:#FF4D5E;
  --on-accent:#0A0C0F;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
body.has-timer .app{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* Шапка экрана */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.top-r{display:flex;gap:8px;align-items:center;flex-shrink:0}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-data);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--rec)} .status.warn i{background:var(--food)} .status.bad i{background:var(--danger)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;padding:0;flex-shrink:0}
.iconbtn svg{width:20px;height:20px}
.cyc{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px;color:var(--muted);font-size:13.5px;text-align:left}
.cyc b{color:var(--ink);font-weight:600}
.cyc svg{width:16px;height:16px;margin-left:auto;flex-shrink:0}
.cyc .dotc{width:8px;height:8px;border-radius:50%;background:var(--rec);flex-shrink:0}

/* Карточки и элементы */
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;color:inherit}
.card.hero{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc)}
.card h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-family:var(--font-ui)}
.card h3{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.15;margin:0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.big{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--raised);color:var(--ink)}
.pill.sc{background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc)}
.t-train{--sc:var(--train)} .t-run{--sc:var(--run)} .t-food{--sc:var(--food)} .t-rec{--sc:var(--rec)} .t-muted{--sc:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--sc,var(--ink));color:var(--on-accent);font-weight:600;font-size:16px}
.btn.full{width:100%}
.btn.ghost{background:var(--raised);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.btn svg{width:18px;height:18px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13.5px;padding:12px 0 0;text-decoration:underline;text-underline-offset:3px}
.chip{min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sc,var(--ink));color:var(--on-accent);border-color:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{min-height:40px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sc)}
.metric{display:grid;gap:6px}
.metric .row{align-items:baseline}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-display);font-weight:700;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--muted)}
.item .r{font-family:var(--font-data);font-size:13px;text-align:right;white-space:nowrap}
.item > svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 10px;border:1px dashed var(--line);border-radius:14px}
.note{background:var(--raised);border-radius:12px;padding:10px 12px;font-size:14px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.in{width:100%;min-width:0;min-height:46px;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* Сегодня: шаги дня и самочувствие */
.tl{display:grid;margin-top:12px}
.tl-r{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl-r:first-child{border-top:0;padding-top:2px}
.tl-t{font-family:var(--font-data);font-size:13px;color:var(--muted);padding-top:2px;white-space:nowrap}
.tl-w{min-width:0}
.tl-w b{font-weight:600}
.tl-w .d{font-size:13px;color:var(--muted)}
.tl-r.k-train .tl-t{color:var(--train)} .tl-r.k-run .tl-t{color:var(--run)} .tl-r.k-work .tl-t,.tl-r.k-study .tl-t{color:var(--ink)} .tl-r.k-food .tl-t{color:var(--food)}
.tl-r.past{opacity:.45}
.tl-r.now{background:var(--raised);border-radius:12px;margin:2px -8px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.tl-r.now + .tl-r{border-top-color:transparent}
.tl-r.now .tl-w b::after{content:"сейчас";margin-left:8px;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--rec);border-radius:99px;padding:1px 7px;vertical-align:2px}
.nowline{display:grid;gap:4px;margin-top:10px;font-size:14px}
.nowline .k{color:var(--muted);display:inline-block;min-width:70px}
.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.feel button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:14px}
.feel button[aria-pressed="true"]{background:var(--sc);color:var(--on-accent);border-color:transparent}
.done-line{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--rec);margin-top:12px}
.done-line svg{width:20px;height:20px;flex-shrink:0}

/* Неделя — полоска */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{background:var(--raised);border:1px solid transparent;border-radius:12px;padding:8px 2px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted)}
.wd.today{border-color:var(--ink);color:var(--ink)}
.wd b{font-family:var(--font-display);font-size:14px;color:var(--ink)}
.wd .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:var(--muted)}
.wd .dot.done{background:var(--sc);color:var(--on-accent)}
.wd .dot.plan{border:1.5px solid var(--sc);color:var(--sc)}
.wd .dot.miss{border:1.5px dashed var(--line)}

/* План: 12 недель, дни, этапы */
.wk12{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.blk{display:grid;gap:6px;min-width:0}
.blk-c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.blk-c button{height:30px;padding:0;border:0;border-radius:8px;background:var(--raised);font-family:var(--font-data);font-size:11.5px;color:var(--muted)}
.blk-c button.dl{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.09) 4px 8px)}
.blk-c button.past{background-color:color-mix(in srgb,var(--rec) 30%,var(--raised));color:var(--ink)}
.blk-c button.cur{background-color:var(--rec);color:var(--on-accent);font-weight:700}
.blk-c button.sel{box-shadow:0 0 0 2px var(--ink)}
.blk-l{font-size:11.5px;color:var(--muted);line-height:1.25}
.blk.on .blk-l{color:var(--ink);font-weight:600}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wnav .c{text-align:center;min-width:0}
.wnav .c b{display:block;font-family:var(--font-display);font-size:17px;line-height:1.2}
.wnav .iconbtn[disabled]{opacity:.3}
.dayrow{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;color:inherit}
.dayrow:first-of-type{border-top:0}
.dayrow .dd{display:grid;justify-items:center;line-height:1.15}
.dayrow .dd span{font-size:11.5px;color:var(--muted)}
.dayrow .dd b{font-family:var(--font-display);font-size:17px}
.dayrow.today{background:var(--raised);border-radius:12px;border-top-color:transparent}
.dayrow.today + .dayrow{border-top-color:transparent}
.dayrow .t{font-weight:600}
.dayrow .t i{font-style:normal;color:var(--sc)}
.dayrow .s{font-size:12.5px;color:var(--muted)}
.st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.st.done{background:var(--rec);color:var(--on-accent)}
.st.plan{border:1.5px solid var(--sc)}
.st.part{border:1.5px solid var(--sc);background:color-mix(in srgb,var(--sc) 30%,transparent);color:var(--ink)}
.st.miss{border:1.5px dashed var(--line)}
.st svg{width:14px;height:14px}
.next{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.next:first-of-type{border-top:0;padding-top:0}
.next .dt{font-family:var(--font-data);font-size:12.5px;color:var(--muted);padding-top:2px}
.stg{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;color:inherit}
.stg:first-of-type{border-top:0;padding-top:0}
.stg .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--raised);color:var(--muted)}
.stg.on .n{background:var(--rec);color:var(--on-accent)}
.exline{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;text-align:left;font-size:14px;color:inherit}
.exline:first-child{border-top:0}
.crit{display:flex;align-items:center;gap:12px;width:100%;background:var(--raised);border:0;border-radius:12px;padding:10px;text-align:left;font-size:14px;color:inherit}
.crit .bx{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.crit .bx svg{width:16px;height:16px;opacity:0}
.crit[aria-pressed="true"] .bx{background:var(--rec);border-color:transparent;color:var(--on-accent)}
.crit[aria-pressed="true"] .bx svg{opacity:1}

/* Тренировка */
.wk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;margin-top:-8px;margin-bottom:4px}
.wk-head .top{margin-bottom:0}
.wk-head h1{font-size:21px}
.wbar{height:5px;border-radius:99px;background:var(--raised);overflow:hidden;margin-top:10px}
.wbar i{display:block;height:100%;background:var(--train);border-radius:99px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;color:inherit}
.exc.cur{border-color:var(--train);box-shadow:inset 0 0 0 1px var(--train)}
.exc.min{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.exc.min.ok{opacity:.72}
.num{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--raised);color:var(--muted)}
.num.ok{background:var(--train);color:var(--on-accent)}
.num svg{width:16px;height:16px}
.exc-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exc-n{font-weight:600;font-size:16px}
.exc-t{font-size:13px;color:var(--muted);margin-top:2px}
.exc-last{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exc-note{font-size:13px;color:var(--train)}
.sets{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 56px;gap:8px;align-items:center}
.sr.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sr .n{font-family:var(--font-data);color:var(--muted);font-size:13px;text-align:center}
.sr .in{min-height:48px;padding:8px;text-align:center;font-size:17px}
.chk{width:56px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;opacity:.35}
.chk.on{background:var(--train);border-color:transparent;color:var(--on-accent)}
.chk.on svg{opacity:1}
.sr.done .in{border-color:color-mix(in srgb,var(--train) 40%,var(--line))}

/* Таймер отдыха */
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer-in{max-width:540px;margin:0 auto;background:var(--raised);border:1px solid var(--train);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.timer-in.over{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 14%,var(--raised))}
.timer .tt{font-family:var(--font-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:96px}
.timer .tl{font-size:12px;color:var(--muted);flex:1;min-width:0}
.timer .tb{min-height:42px;min-width:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}

/* Нижняя панель */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{background:none;border:0;min-height:62px;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--sc)}

/* Лист снизу */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0}
.sheet ol,.sheet ul{padding-left:20px;margin:6px 0}
.sheet li{margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--train) 14%,transparent);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.shrow{display:grid;grid-template-columns:28px minmax(0,1fr) 10px minmax(0,1fr);gap:8px;align-items:center}
.shrow select.in{min-height:42px;padding:6px 8px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:22;width:58px;height:58px;border-radius:18px;border:0;background:var(--sc);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.fab svg{width:26px;height:26px}
body.has-timer .fab{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

var DAY=864e5;
function progWeek(d){var diff=Math.round((pd(ds(d))-START)/DAY);if(diff<0)return 0;return Math.floor(diff/7)+1;}
function weekObj(n){return WEEKS[Math.min(Math.max(n,1),12)-1];}
function weekStart(n){return addDays(START,(n-1)*7);}
function halve(s){return s.replace(/^(\d+)(\s*×)/,function(m,n,x){return Math.max(2,Math.ceil(Number(n)/2))+x;});}
function resolveSlot(slot,w){
  var o=(slot.w&&slot.w[w.n])||{};var bk='b'+w.blk;
  if(slot.from&&w.blk<slot.from&&!o.ex)return null;
  if(slot.skipDl&&w.dl)return null;
  var exId=o.ex||(slot.exBy&&slot.exBy[bk])||slot.ex;
  var sets=o.sets||slot.sets[bk]||slot.sets.all;
  if(!exId||!sets)return null;
  var rest=typeof slot.rest==='object'?slot.rest[bk]:slot.rest;
  if(w.dl&&!o.sets)sets=halve(sets);
  return {exId:exId,sets:sets,rest:rest,note:o.note||''};
}
function parseSets(s){
  var m=/^(\d+)\s*×\s*(.+)$/.exec(s);var n=m?Number(m[1]):1;var reps=m?m[2]:s;
  var unit=/\sм$/.test(reps)?'м':(/\sс$/.test(reps)?'с':(/мин/.test(reps)?'мин':'повт'));
  var r=/(\d+)(?:\s*[–-]\s*(\d+))?/.exec(reps);var lo=r?Number(r[1]):null;var hi=r&&r[2]?Number(r[2]):lo;
  return {n:n,reps:reps,unit:unit,lo:lo,hi:hi};
}
function parseRest(s){if(!s||s==='0')return 0;var m=/(\d+(?:,\d+)?)\s*(мин|с)/.exec(s);if(!m)return 0;var v=parseFloat(m[1].replace(',','.'));return Math.round(m[2]==='мин'?v*60:v);}
function sessionPlan(letter,n){
  var w=weekObj(n||1);var out=[];
  SESS[letter].slots.forEach(function(sl){var r=resolveSlot(sl,w);if(r)out.push(r);});
  return out;
}

/* Статус дня: done — всё сделано, part — частично, plan — впереди, miss — пропущено, rest — тренировки нет */
function dayStatus(d){
  var k=ds(d),p=dayPlan(d),today=ds(new Date());
  var hasW=doneWorkouts().some(function(w){return w.date===k;}),hasR=allRuns().some(function(r){return r.date===k;});
  if(p.skipped&&!hasW&&!hasR)return 'skip';
  if(p.pre||p.after||(!p.sess&&!p.run))return (hasW||hasR)?'done':'rest';
  var need=(p.sess?1:0)+(p.run?1:0),got=(p.sess&&hasW?1:0)+(p.run&&hasR?1:0);

  if(got)return 'part';

var COLLS=['meta','days','workouts','runs','hyrox'];

function queueWrite(c,id){var k=c+'/'+id;var p=S.pend[k]||(S.pend[k]={});clearTimeout(p.t);p.t=setTimeout(function(){p.t=null;flush(c,id);},500);}
function flush(c,id){
  var k=c+'/'+id;var p=S.pend[k];if(!S.db||!p)return;
  if(p.busy){p.again=true;return;}
  p.busy=true;var body=S.data[c][id];
  var op=body===undefined?S.db.doc(k).delete():S.db.doc(k).set(body);
  op.then(function(){},function(e){dbError(e,true);}).then(function(){p.busy=false;if(p.again){p.again=false;flush(c,id);}});
}
function flushAll(){Object.keys(S.pend).forEach(function(k){var p=S.pend[k];if(p.t){clearTimeout(p.t);p.t=null;var i=k.indexOf('/');flush(k.slice(0,i),k.slice(i+1));}});}

function dbError(e,isWrite){

  if(code==='quota_exceeded')toast('Хранилище заполнено. Экспортируй данные и удали старые записи в настройках.');
  else if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){S.db=null;S.mode='local';updateStatus();toast('Облако недоступно — сохраняю только на этом устройстве.');}
  else if(isWrite)toast('Не удалось сохранить в облако. Данные остались на устройстве, попробую при следующем изменении.');
}

      var obj={};snap.docs.forEach(function(d){obj[d.id]=d.data();});
      Object.keys(S.pend).forEach(function(k){var i=k.indexOf('/');if(k.slice(0,i)!==c)return;var id=k.slice(i+1);if(S.pend[k].t){if(S.data[c][id]===undefined)delete obj[id];else obj[id]=S.data[c][id];}});
      S.data[c]=obj;if(!snap.metadata.fromCache){S.loaded[c]=true;if(COLLS.every(function(x){return S.loaded[x];})){S.offline=false;if(!S.cleaned){S.cleaned=true;setTimeout(cleanupWorkouts,0);}}}

function calcTargets(p){
  var w=num(p.weight),h=num(p.height),a=num(p.age),act=num(p.activity)||1.7,goal=num(p.goal);if(goal==null)goal=100;
  if(!(w&&h&&a))return null;
  var bmr=10*w+6.25*h-5*a+5,tdee=bmr*act,kcal=Math.round((tdee+goal)/100)*100;
  var P=Math.round(w*2.1),F=Math.round(w),C=Math.round((kcal-P*4-F*9)/4);
  return {kcal:kcal,p:P,f:F,c:C,water:Math.round((w*35+500)/100)*100,bmr:Math.round(bmr),tdee:Math.round(tdee/10)*10};
}
function dayTotals(day){var t={kcal:0,p:0,f:0,c:0};(day&&day.meals||[]).forEach(function(m){t.kcal+=m.kcal||0;t.p+=m.p||0;t.f+=m.f||0;t.c+=m.c||0;});['kcal','p','f','c'].forEach(function(k){t[k]=Math.round(t[k]);});return t;}
function weightStats(dStr){
  var d=pd(dStr),cur=[],prev=[];
  for(var i=0;i<14;i++){var k=ds(addDays(d,-i));var day=S.data.days[k];if(day&&day.weight!=null)(i<7?cur:prev).push(day.weight);}
  function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  var a=avg(cur),b=avg(prev);var delta=(cur.length>=3&&prev.length>=3)?a-b:null;var v=null;
  if(delta!=null){if(delta>0.3)v={t:'Быстрее плана. Если и прошлая неделя такая же — убери 150 ккал, в основном жиры.',c:'t-food'};else if(delta>=0.05)v={t:'В плане. Ничего не меняй.',c:'t-rec'};else if(delta>-0.1)v={t:'Вес стоит. Если и прошлая неделя такая же — добавь 150 ккал, в основном углеводы.',c:'t-food'};else v={t:'Вес падает. Добавь 150–200 ккал и проверь, всё ли записано.',c:'t-train'};}
  return {avg:a,n:cur.length,delta:delta,verdict:v};
}
function baselineRhr(dStr){var d=pd(dStr),vals=[];for(var i=1;i<=14;i++){var day=S.data.days[ds(addDays(d,-i))];if(day&&day.check&&day.check.rhr)vals.push(day.check.rhr);}if(vals.length<3)return null;vals.sort(function(a,b){return a-b;});return vals[Math.floor(vals.length/2)];}
function readiness(c,base){
  if(!c)return null;
  var CLS={green:'t-rec',yellow:'t-food',red:'t-train'},LBL={green:'Зелёный',yellow:'Жёлтый',red:'Красный'};
  var TXT={green:'Тренируйся по плану.',yellow:'Облегчи: минус 1 подход в каждом упражнении или вес −5–10%. Интервалы замени лёгким бегом.',red:'Сегодня отдых: 20–30 минут ходьбы и растяжка. Тренировку не догоняй — продолжай по плану со следующей.'};
  if(c.level)return {level:c.level,notes:[],text:TXT[c.level],cls:CLS[c.level],label:LBL[c.level]};
  if(c.sleep==null&&c.energy==null&&c.soreness==null&&c.stress==null&&c.fatigue==null&&!c.rhr)return null;
  var bad=0,notes=[],hrUp=false;
  if(c.sleep!=null&&c.sleep<6.5){bad++;notes.push('мало сна');}
  if(c.energy!=null&&c.energy<=2){bad++;notes.push('мало энергии');}
  if(c.soreness!=null&&c.soreness>=4){bad++;notes.push('мышцы болят');}
  if(c.stress!=null&&c.stress>=4){bad++;notes.push('стресс');}
  if(c.fatigue!=null&&c.fatigue>=4){bad++;notes.push('усталость после смены');}
  if(c.rhr&&base){var dd=c.rhr-base;if(dd>=8){hrUp=true;notes.push('пульс +'+dd);}else if(dd>=5){bad++;notes.push('пульс +'+dd);}}
  var level=(bad>=3||hrUp)?'red':(bad>=1?'yellow':'green');
  var text={green:'Тренировка по плану.',yellow:'Минус 1 подход в каждом упражнении или вес −5–10%, запас +1. Интервалы замени лёгким бегом.',red:'Отдых или 20–30 минут ходьбы и растяжки.'}[level];
  return {level:level,notes:notes,text:text,cls:{green:'t-rec',yellow:'t-food',red:'t-train'}[level],label:{green:'Зелёный',yellow:'Жёлтый',red:'Красный'}[level]};
}
function allWorkouts(){return Object.keys(S.data.workouts).map(function(k){return S.data.workouts[k];}).filter(function(w){return w&&w.exercises;});}

function lastPerf(exId,excludeId){var list=doneWorkouts();for(var i=0;i<list.length;i++){var wk=list[i];if(wk.id===excludeId)continue;var ex=(wk.exercises||[]).find(function(e){return e.exId===exId;});if(ex){var s=doneSets(ex);if(s.length)return {date:wk.date,sets:s};}}return null;}
function suggestion(exId,hi,excludeId){
  var lp=lastPerf(exId,excludeId);if(!lp)return null;var info=EX[exId]||{};var minRir=info.minRir||0;
  var ws=lp.sets.map(function(s){return s.w||0;});var lastW=Math.max.apply(null,ws);

/* ---------- Тренировка ---------- */
function firstOpen(exs){for(var i=0;i<exs.length;i++){if((exs[i].sets||[]).some(function(s){return !s.done;}))return i;}return -1;}
function startWorkout(L){
  if(activeWorkout()){toast('Сначала заверши текущую тренировку.');tab='home';render();return;}
  var now=new Date(),tp=dayPlan(now),n=tp.sess===L?tp.week:Math.min(Math.max(progWeek(now),1),12),id=uid();
  var exs=[];
  if(L!=='free'){
    sessionPlan(L,n).forEach(function(it){
      var ps=parseSets(it.sets);var sg=suggestion(it.exId,ps.hi,null);var lp=lastPerf(it.exId,null);
      var sets=[];for(var i=0;i<ps.n;i++){var lw=lp&&lp.sets[i]?lp.sets[i].w:(lp?lp.sets[lp.sets.length-1].w:null);sets.push({w:sg&&sg.w!=null?sg.w:lw,r:null,rir:null,done:false});}
      exs.push({exId:it.exId,name:EX[it.exId].name,target:it.sets,rest:it.rest,restSec:parseRest(it.rest),unit:ps.unit,lo:ps.lo,hi:ps.hi,note:it.note,sugg:sg?sg.text:null,sets:sets});
    });
  }
  var body={id:id,date:ds(now),session:L,week:n,title:L==='free'?'Своя тренировка':'Сила '+L+' · '+SESS[L].title,status:'active',startedAt:Date.now(),exercises:exs};
  ui.exOpen=null;ui.inWorkout=true;put('workouts',id,body);tab='home';lsSet('hxapp.tab',tab);render();window.scrollTo(0,0);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
}
function scrActive(wk){
  var mins=Math.round((Date.now()-wk.startedAt)/60000),exs=wk.exercises||[];

  var open=(ui.exOpen!=null&&ui.exOpen<exs.length)?ui.exOpen:firstOpen(exs);
  var h='<div class="wk-head">'+topbar(esc(wk.title),'<span id="wk-min">'+mins+'</span> мин · подходов '+doneCount+' из '+total,'<button class="btn sm ghost" data-act="wmin">Свернуть</button>')+'<div class="wbar"><i style="width:'+(total?Math.round(doneCount/total*100):0)+'%"></i></div></div>';

    if(lp||ex.sugg)h+='<div class="exc-last">'+(lp?'Прошлый раз: <span class="mono">'+lp.sets.map(function(s){return fkg(s.w)+'×'+s.r;}).join(' · ')+'</span>':'')+(ex.sugg?' <span class="pill sc t-train">'+esc(ex.sugg)+'</span>':'')+'</div>';
    else if(e.start)h+='<div class="exc-last">Старт: '+esc(e.start)+'</div>';

    if(ex.note)h+='<div class="exc-note">'+esc(ex.note)+'</div>';
    var unitLbl=ex.unit==='повт'?'повторы':ex.unit;
    h+='<div class="sets"><div class="sr head"><span>#</span><span>вес, кг</span><span>'+unitLbl+'</span><span></span></div>';

        '<input class="in" id="'+idb+'-w" inputmode="decimal" data-ch="set" data-f="w" data-i="'+i+'" data-j="'+j+'" value="'+(s.w!=null?fkg(s.w):'')+'" placeholder="—" aria-label="Вес, подход '+(j+1)+'">'+
        '<input class="in" id="'+idb+'-r" inputmode="numeric" data-ch="set" data-f="r" data-i="'+i+'" data-j="'+j+'" value="'+(s.r!=null?s.r:'')+'" placeholder="'+(ex.hi||'')+'" aria-label="'+unitLbl+', подход '+(j+1)+'">'+
        '<button class="chk'+(s.done?' on':'')+'" data-act="setdone" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+!!s.done+'" aria-label="Подход '+(j+1)+' выполнен">'+ICON.check+'</button></div>';
    });
    h+='</div><div class="small muted">Пустое поле = сделал по плану'+(ex.hi?' ('+ex.hi+')':'')+'. Галочка запускает таймер отдыха.</div>';
    h+='<div class="wrap-row"><button class="chip" data-act="addset" data-i="'+i+'">+ подход</button>'+(sets.length>1?'<button class="chip" data-act="delset" data-i="'+i+'">− подход</button>':'')+'</div></div>';
  });
  h+='<button class="btn ghost full" data-act="addex">'+ICON.plus+' Добавить упражнение</button>';
  h+='<div class="field"><label for="wk-notes">Заметка: самочувствие, плечо, что изменить</label><textarea class="in" id="wk-notes" data-ch="wnotes">'+esc(wk.notes||'')+'</textarea></div>';
  h+='<div class="grid2"><button class="btn danger" data-act="wcancel">Отменить</button><button class="btn t-train" data-act="wfinish">Завершить</button></div>';

/* ---------- Прогресс ---------- */
function scrStats(){
  var now=new Date(),d=ds(now),mon=addDays(now,-wIdx(now));
  var h=topbar('Прогресс','Главные показатели этапа 1');
  h+='<div class="stack">';
  // Неделя
  var sP=0,sD=0,rP=0,rD=0;
  for(var i=0;i<7;i++){var dd=addDays(mon,i),k=ds(dd),p=dayPlan(dd);
    if(p.sess){sP++;if(doneWorkouts().some(function(w){return w.date===k;}))sD++;}
    if(p.run){rP++;if(allRuns().some(function(r){return r.date===k;}))rD++;}}
  var km=weekKm(),tot=doneWorkouts().length,totR=allRuns().length;
  if(!sP&&!rP&&progWeek(now)===0)h+='<div class="card"><h2>Эта неделя</h2><div class="small muted">Программа стартует в понедельник, 9 ноября. Здесь будет видно, сколько тренировок и пробежек недели уже сделано.</div></div>';
  else h+='<div class="card"><h2>Эта неделя</h2><div class="kv"><div><div class="mid">'+sD+' из '+sP+'</div><div class="small muted">силовых</div></div><div><div class="mid">'+rD+' из '+rP+'</div><div class="small muted">пробежек · '+f1(km)+' км</div></div></div><div class="small muted" style="margin-top:10px">С начала программы: '+tot+' '+plural(tot,'тренировка','тренировки','тренировок')+', '+totR+' '+plural(totR,'пробежка','пробежки','пробежек')+'.</div></div>';
  // Цели этапа 1
  var b=bestSet('bench'),t=bestSet('trap'),pu=maxReps('pullup');

    ['Вес, среднее 7 дней',ws.avg!=null?f1(ws.avg)+' кг':'—','цель к январю: 75–76 кг'],
    ['Жим лёжа',b?fkg(b.w)+' × '+b.r:'—','цель: 70–75 кг × 5'],
    ['Трэп-гриф',t?fkg(t.w)+' × '+t.r:'—','цель: ≈100 кг × 5'],

    ['Бег без остановки',longEasy?fmtDur(longEasy):'—','цель: 30 минут'],

  ];
  h+='<div><div class="lbl" style="margin-left:2px">Цели этапа 1 · лучший результат</div><div class="kv">'+tiles.map(function(x){return '<div class="kpi"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>';}).join('')+'</div></div>';
  if(ws.delta!=null)h+='<div class="note small"><span class="mono">'+(ws.delta>=0?'+':'−')+f1(Math.abs(ws.delta))+' кг за неделю.</span> '+ws.verdict.t+'</div>';
  else h+='<div class="note small muted">Вес взвешивай каждое утро во вкладке «Питание». Через неделю здесь появится, растёт ли он по плану: +0,1–0,25 кг в неделю.</div>';
  // История
  var hist=[];doneWorkouts().forEach(function(w){hist.push({k:'w',date:w.date,at:w.startedAt||0,o:w});});allRuns().forEach(function(r){hist.push({k:'r',date:r.date,at:r.createdAt||0,o:r});});

    var r=x.o,p=pace(r);return '<button class="item" data-act="runedit" data-id="'+esc(r.id)+'"><span class="num" style="background:var(--run);color:var(--on-accent)">Б</span><div class="grow"><div class="t">'+(RUNTYPES[r.type]||'Бег')+' · '+f1(r.distKm||0)+' км</div><div class="d">'+dShort(pd(r.date))+(r.hr?' · пульс '+r.hr:'')+'</div></div><div class="r">'+(r.timeSec?fmtDur(r.timeSec):'')+(p?'<br><span class="muted">'+fmtDur(p)+'/км</span>':'')+'</div></button>';

  return h+'</div>';
}
function stationsBody(){

function beep(){try{if(!audio)return;[0,0.25,0.5].forEach(function(dt){var o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);var t0=audio.currentTime+dt;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);o.start(t0);o.stop(t0+0.2);});}catch(e){}}

function planCtl(k,p){

  if(p.skipped)return '<button class="btn sm ghost full" style="margin-top:12px" data-act="unskip" data-d="'+k+'">Вернуть тренировку по плану</button>';
  if(p.moved)return '<button class="btn sm ghost full" style="margin-top:12px" data-act="unmove" data-d="'+k+'">Вернуть на '+dRef(pd(p.movedFrom))+'</button>';

  var p=dayPlan(pd(k)),todayK=ds(new Date()),first=p.items.filter(function(x){return x.k!=='work';})[0],t0=first?first.t.split('–')[0]:'15:00';
  var start=pd(todayK>ds(START)?todayK:ds(START)),opts='';

/* Один раз: всё, что было начато до старта программы (9 ноября), удаляется и не попадает в статистику.
   Всегда: начатая и брошенная без единого подхода тренировка через 3 часа исчезает;

function cleanupWorkouts(){
  var now=Date.now(),todayK=ds(new Date()),startK=ds(START),first=!lsGet('hxapp.mig2',false);
  allWorkouts().forEach(function(w){
    var any=(w.exercises||[]).some(function(ex){return doneSets(ex).length;});

    if(w.status!=='active')return;
    var age=now-(w.updatedAt||w.startedAt||0);
    if(!any&&age>3*3600e3)put('workouts',w.id,null);
    else if(any&&w.date<todayK)edit('workouts',w.id,function(b){b.status='done';b.endedAt=b.updatedAt||Date.now();b.exercises=b.exercises.map(function(ex){ex.sets=ex.sets.filter(function(s){return s.done;});return ex;}).filter(function(ex){return ex.sets.length;});b.volume=workoutVolume(b);});

    var done=S.data.workouts[wk.id];var dur=Math.round((done.endedAt-done.startedAt)/60000);
    openSheet('Тренировка завершена','<div class="kv"><div class="kpi"><div class="l">Длительность</div><div class="v">'+dur+' мин</div></div><div class="kpi"><div class="l">Тоннаж</div><div class="v">'+(done.volume||0).toLocaleString('ru-RU')+' кг</div></div></div><p class="small muted" style="margin-top:10px">В течение часа — еда с белком и углеводами. Вечером 15 минут восстановления: массажный пистолет и растяжка.</p><button class="btn full t-train" data-act="sclose">Готово</button>');
  },
  tadd:function(el){if(!T.end)return;T.end+=Number(el.dataset.v)*1000;T.over=false;renderTimer();},
  tstop:function(){stopTimer();},
  pfcalc:function(){var t=calcTargets({weight:$('#pf-w').value,height:$('#pf-h').value,age:$('#pf-a').value,activity:$('#pf-act').value,goal:$('#pf-goal').value});if(!t){$('#pf-calc').innerHTML='<div class="note small">Заполни вес, рост и возраст.</div>';return;}$('#pf-calc').innerHTML='<div class="note small mono">Основной обмен '+t.bmr+' · поддержание '+t.tdee+' · цель '+t.kcal+' ккал</div>';$('#tg-k').value=t.kcal;$('#tg-p').value=t.p;$('#tg-f').value=t.f;$('#tg-c').value=t.c;$('#tg-wt').value=t.water;},
  pfsave:function(){var p=clone(profile())||{};p.weight=num($('#pf-w').value);p.height=num($('#pf-h').value);p.age=num($('#pf-a').value);p.activity=$('#pf-act').value;p.goal=num($('#pf-goal').value);
    var tg={kcal:num($('#tg-k').value),p:num($('#tg-p').value),f:num($('#tg-f').value),c:num($('#tg-c').value),water:num($('#tg-wt').value)};
    if(!tg.kcal){var t=calcTargets(p);if(t)tg={kcal:t.kcal,p:t.p,f:t.f,c:t.c,water:t.water};}
    p.targets=tg;p.updatedAt=Date.now();put('meta','profile',p);closeSheet();toast('Профиль сохранён');},
  export:function(){
    var data=JSON.stringify({app:'hyrox-tracker',version:1,exportedAt:new Date().toISOString(),data:S.data},null,1);
    var fn='hyrox-backup-'+ds(new Date())+'.json';
    function done(){lsSet('hxapp.lastExport',Date.now());toast('Резервная копия готова');requestRender();}
    function showText(){var out=$('#export-out');if(!out){sheetSettings();out=$('#export-out');}if(out)out.innerHTML='<div class="field"><label for="exp-text">Скопируй и сохрани этот текст</label><textarea class="in" id="exp-text" style="min-height:140px" readonly>'+esc(data)+'</textarea></div>';}
    function standalone(){
      try{var file=new File([data],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fn}).then(done,function(){});return;}}catch(e){}
      try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();done();return;}catch(e){}
      showText();
    }
    if(!(window.claude&&typeof window.claude.use==='function')){standalone();return;}
    window.claude.use('downloads').then(function(dl){if(!dl)throw {code:'unavailable'};return dl.save({filename:fn,data:data});}).then(done).catch(function(e){if(e&&e.code==='declined')return;showText();});
  },
  famode:function(el){foodMode=el.dataset.v;foodSel=null;renderFoodAdd();},
  fapick:function(el){foodSel=allFoods()[Number(el.dataset.i)];renderFoodAdd();setTimeout(function(){var g=$('#fa-g');if(g)g.focus();},50);},
  faback:function(){foodSel=null;renderFoodAdd();},
  fagset:function(el){$('#fa-g').value=el.dataset.v;faPreview();},
  faadd:function(){var g=num($('#fa-g').value);if(!g||!foodSel){toast('Введи граммы');return;}var f=foodSel,k=g/100,slot=$('#fa-slot').value;var m={id:uid(),name:f[0],grams:g,per100:[f[1],f[2],f[3],f[4]],kcal:f[1]*k,p:f[2]*k,f:f[3]*k,c:f[4]*k,slot:slot,at:Date.now()};editDay(ui.foodDate,function(b){b.meals=b.meals||[];b.meals.push(m);});toast('Добавлено: '+f[0]+', '+fkg(g)+' г');foodSel=null;renderFoodAdd();},
  fatpl:function(el){var t=MEALS[Number(el.dataset.i)];var slot=$('#fa-slot').value;editDay(ui.foodDate,function(b){b.meals=b.meals||[];b.meals.push({id:uid(),name:t.name,grams:null,kcal:t.kcal,p:t.p,f:t.f,c:t.c,slot:slot,at:Date.now()});});toast('Добавлено: '+t.name);},
  ownsave:function(){var n=$('#own-n').value.trim();var k=num($('#own-k').value),p=num($('#own-p').value)||0,f=num($('#own-f').value)||0,c=num($('#own-c').value)||0;if(!n||k==null){toast('Нужны название и калории');return;}edit('meta','foods',function(b){b.items=b.items||[];b.items.unshift({id:uid(),name:n,kcal:k,p:p,f:f,c:c});});foodMode='base';foodQ=n;renderFoodAdd();toast('Продукт сохранён');},
  entry:function(el){sheetEntry(Number(el.dataset.i));},
  endel:function(el){var i=Number(el.dataset.i);editDay(ui.foodDate,function(b){b.meals.splice(i,1);});closeSheet();},
  ensave:function(el){var i=Number(el.dataset.i);var gEl=$('#en-g');var slot=$('#en-slot').value;editDay(ui.foodDate,function(b){var m=b.meals[i];if(!m)return;m.slot=slot;if(gEl&&m.per100){var g=num(gEl.value);if(g){var k=g/100;m.grams=g;m.kcal=m.per100[0]*k;m.p=m.per100[1]*k;m.f=m.per100[2]*k;m.c=m.per100[3]*k;}}});closeSheet();},
  rntype:function(el){window.__rt=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});},
  rnsave:function(el){var id=el.dataset.id||uid();var km=num($('#rn-km').value),t=parseDur($('#rn-t').value);if(!km&&!t){toast('Укажи дистанцию или время');return;}var prev=S.data.runs[id];put('runs',id,{id:id,date:$('#rn-date').value||ds(new Date()),type:window.__rt||'easy',distKm:km,timeSec:t,hr:num($('#rn-hr').value),rpe:num($('#rn-rpe').value),notes:$('#rn-notes').value.trim(),createdAt:prev&&prev.createdAt||Date.now(),updatedAt:Date.now()});closeSheet();toast('Пробежка сохранена');},
  rndel:function(el){var id=el.dataset.id;confirmSheet('Удалить пробежку?','Запись исчезнет из истории и графиков.','Удалить',function(){put('runs',id,null);});},
  hxsave:function(el){var id=el.dataset.id||uid();put('hyrox',id,{id:id,station:$('#hx-st').value,date:$('#hx-date').value||ds(new Date()),load:num($('#hx-load').value),amount:num($('#hx-amt').value),timeSec:parseDur($('#hx-t').value),notes:$('#hx-notes').value.trim(),updatedAt:Date.now()});closeSheet();sheetStations();toast('Запись сохранена');},
  hxdel:function(el){var id=el.dataset.id;confirmSheet('Удалить запись?','Запись станции будет удалена.','Удалить',function(){put('hyrox',id,null);sheetStations();});},
  crit:function(el){var k=el.dataset.k;edit('meta','profile',function(b){b.criteria=b.criteria||{};b.criteria[k]=!b.criteria[k];});}
};
var CH={
  weight:function(el){var v=num(el.value);var d=el.dataset.date;if(v!=null&&(v<30||v>200)){toast('Проверь вес: '+el.value);return;}editDay(d,function(b){b.weight=v;});},
  set:function(el){var wk=activeWorkout();if(!wk)return;var i=Number(el.dataset.i),j=Number(el.dataset.j),f=el.dataset.f;var v=f==='rir'?(el.value===''?null:Number(el.value)):num(el.value);edit('workouts',wk.id,function(b){b.exercises[i].sets[j][f]=v;});},
  ncfg:function(){var n=notifyCfg();n.pre=$('#nt-pre').value;n.day=$('#nt-day').value;saveNotify(n);if(n.on)syncPush(true).then(function(){var m=notifyCfg();toast(m.lastErr||'Время напоминаний сохранено');});else toast('Сохранено');},
  wnotes:function(el){var wk=activeWorkout();if(!wk)return;edit('workouts',wk.id,function(b){b.notes=el.value;});},
  import:function(el){
    var f=el.files&&el.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){try{var j=JSON.parse(rd.result);var d=j&&j.data;if(!d)throw 0;var n=0;COLLS.forEach(function(c){if(d[c])n+=Object.keys(d[c]).length;});
      confirmSheet('Импортировать данные?','В файле записей: '+n+'. Записи с теми же датами и id будут заменены.','Импортировать',function(){var list=[];COLLS.forEach(function(c){if(d[c])Object.keys(d[c]).forEach(function(id){list.push([c,id,d[c][id]]);});});var k=0;(function step(){var chunk=list.slice(k,k+20);chunk.forEach(function(x){S.data[x[0]][x[1]]=x[2];queueWrite(x[0],x[1]);});k+=20;saveCache();if(k<list.length)setTimeout(step,700);else{render();toast('Импортировано: '+list.length);}})();});
    }catch(e){toast('Это не файл экспорта трекера.');}};rd.readAsText(f);
  }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=A[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.ch&&CH[el.dataset.ch]&&el.dataset.ch!=='faq'&&el.dataset.ch!=='fagrams')CH[el.dataset.ch](el);});
document.addEventListener('input',function(e){var el=e.target;if(!el.dataset)return;if(el.dataset.ch==='faq'){foodQ=el.value;var q=foodQ.toLowerCase();var l=$('#fa-list');if(l)l.innerHTML=foodListHtml(allFoods().filter(function(f){return !q||f[0].toLowerCase().indexOf(q)>=0;}));}else if(el.dataset.ch==='fagrams')faPreview();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#sheet-root').innerHTML)closeSheet();});

/* ================= Запуск ================= */
loadCache();cleanupWorkouts();
(function(){var a0=activeWorkout();ui.inWorkout=!!(a0&&Date.now()-(a0.updatedAt||a0.startedAt||0)<30*60000);})();
render();
setTimeout(function(){syncPush(false);},1500);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){syncPush(false);requestRender();}});
/* Раз в 30 секунд: минуты тренировки, а на главном экране — отметка «сейчас» в распорядке */
setInterval(function(){if(tab!=='home'||isEditing()||$('#sheet-root').innerHTML)return;var wk=activeWorkout();if(wk){var el=$('#wk-min');if(el)el.textContent=Math.round((Date.now()-wk.startedAt)/60000);}else render();},30000);
(function(){
  var p=(window.claude&&typeof window.claude.use==='function')?window.claude.use('db'):Promise.resolve(null);
  p.then(function(db){
    if(!db){S.mode='local';updateStatus();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}requestRender();return;}
    S.db=db;S.mode='cloud';updateStatus();subscribe();
    setTimeout(function(){if(!COLLS.every(function(c){return S.loaded[c];})){S.offline=true;updateStatus();}},10000);
  },function(){S.mode='local';updateStatus();});
})();
})();
</script>
